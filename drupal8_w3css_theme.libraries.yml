# Font Awesome.
font-awesome:
  remote: https://fortawesome.github.io/Font-Awesome/
  version: 4.7.0
  license:
    name: MIT
    url: https://fortawesome.github.io/Font-Awesome/license/
    gpl-compatible: true
  css:
    base:
      https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css: { type: external, minified: true }

d8w3css-font-awesome-local:
  Version: 4.7.0
  css:
    base:
      fonts/font-awesome.4.7.0.css: {}

# Google Font.
d8w3css-google-font-external:
  Version: VERSION
  css:
    base:
      'https://fonts.googleapis.com/css2?family=Open+Sans&display=swap': { type: external, minified: true }

d8w3css-google-font-local:
  Version: VERSION
  css:
    base:
      fonts/google-font.css: {}

# Theme CSS.
d8w3css-global-styling:
  Version: VERSION
  css:
    base:
      css/base/base.css: {}
    layout:
      css/layout/layout-regions.css: {}
      css/layout/layout-width.css: {}
      css/layout/layout-node-edit.css: {}
    component:
      css/components/system-messages.css: {}
      css/components/forms.css: {}
      css/components/breadcrumb.css: {}
      css/components/system-tabs.css: {}
      css/components/maintenance-page.css: {}
      css/components/system-admin.css: {}
      css/components/w3css-tables.css: {}
      css/components/global-menu.css: {}
      css/components/v-menu.css: {}
      css/components/site-branding.css: {}
      css/components/user-menu.css: {}
      css/components/footer-menu.css: {}
      css/components/default-node.css: {}
      css/components/page-title.css: {}
      css/components/search-page.css: {}
      css/components/search-block.css: {}
      css/components/pager.css: {}
      css/components/comments.css: {}
      css/components/default-views.css: {}
      css/components/layout-builder.css: {}
      css/components/webform.css: {}
      css/components/node-form.css: {}
      css/components/teaser-mode.css: {}
      css/components/sitemap.css: {}
      css/components/ckeditor.css: {}

    theme:
      css/theme/a-image.css: {}
      css/theme/min-width-993.css: {}
      css/theme/max-width-992.css: {}
      css/theme/max-min-width-992-601.css: {}
      css/theme/max-width-767.css: {}
      css/theme/max-width-600.css: {}
  js:
    js/custom.js: {}
  dependencies:
    - core/jquery
    - core/drupal.ajax
    - core/drupal
    - core/drupalSettings
    - core/jquery.once

d8w3css-default-color-theme:
  Version: VERSION
  css:
    theme:
      css/theme/default-color-theme.css: {}

# Full Opacity on Scroll.
d8w3css-full-opacity:
  version: VERSION
  header: true
  js:
    js/full.opacity.on.scroll.js: { }
  dependencies:
    - core/jquery
    - core/drupal

