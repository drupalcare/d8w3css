name: W3CSS Theme
core_version_requirement: ^11.3 || ^12
description: 'Provides a base theme built on W3.CSS, with 22 regions, horizontal or vertical menus, width presets, color themes and fonts, all set from the theme settings.'
package: W3CSS
type: theme
base theme: false

# Libraries
libraries:
  # One library per file, in load order (the old w3-css and d8w3css-global-styling
  # ids still work as deprecated aliases).
  - drupal8_w3css_theme/base-layers
  - drupal8_w3css_theme/base-drupal
  - drupal8_w3css_theme/utility-extended-classes
  - drupal8_w3css_theme/utility-color-camouflage
  - drupal8_w3css_theme/utility-color-european-signal
  - drupal8_w3css_theme/utility-color-fashion
  - drupal8_w3css_theme/utility-color-flat-ui
  - drupal8_w3css_theme/utility-color-food
  - drupal8_w3css_theme/utility-color-ios
  - drupal8_w3css_theme/utility-color-metro-ui
  - drupal8_w3css_theme/utility-color-us-highway
  - drupal8_w3css_theme/utility-color-us-safety
  - drupal8_w3css_theme/utility-color-vivid
  - drupal8_w3css_theme/utility-color-win8
  - drupal8_w3css_theme/base-w3css-base
  - drupal8_w3css_theme/layout-page
  - drupal8_w3css_theme/layout-page-width
  - drupal8_w3css_theme/component-status-messages
  - drupal8_w3css_theme/component-form-element
  - drupal8_w3css_theme/component-media
  - drupal8_w3css_theme/component-breadcrumb
  - drupal8_w3css_theme/component-local-tasks
  - drupal8_w3css_theme/component-maintenance-page
  - drupal8_w3css_theme/component-system-admin
  - drupal8_w3css_theme/component-table
  - drupal8_w3css_theme/component-menu
  - drupal8_w3css_theme/component-menu-responsive-v
  - drupal8_w3css_theme/component-site-branding
  - drupal8_w3css_theme/component-user-login
  - drupal8_w3css_theme/component-footer-menu
  - drupal8_w3css_theme/component-node
  - drupal8_w3css_theme/component-page-title
  - drupal8_w3css_theme/component-search-result
  - drupal8_w3css_theme/component-search-block-form
  - drupal8_w3css_theme/component-pager
  - drupal8_w3css_theme/component-comment
  - drupal8_w3css_theme/component-views-view
  - drupal8_w3css_theme/component-layout-builder
  - drupal8_w3css_theme/component-webform
  - drupal8_w3css_theme/component-node-form
  - drupal8_w3css_theme/component-menu-sitemap
  - drupal8_w3css_theme/component-contact-form
  - drupal8_w3css_theme/component-ckeditor
  - drupal8_w3css_theme/component-image
  - drupal8_w3css_theme/theme-min-width-993
  - drupal8_w3css_theme/theme-max-width-992
  - drupal8_w3css_theme/theme-max-min-width-992-601
  - drupal8_w3css_theme/theme-max-width-767
  - drupal8_w3css_theme/theme-max-width-600
  - drupal8_w3css_theme/utility-animate-border
  - drupal8_w3css_theme/component-site-branding-animation
  - drupal8_w3css_theme/base-custom-js

ckeditor_stylesheets:
  - css/admin/w3css-ckeditor-iframe.css

ckeditor5-stylesheets:
  - css/admin/w3css-ckeditor5.css

# Regions
regions:
  header: 'Header'
  primary_menu_vertical: 'Primary Menu Vertical'
  primary_menu: 'Primary Menu'
  welcome_text: 'Welcome Text'
  top_first: 'Top First Container'
  top_second: 'Top Second Container'
  top_third: 'Top Third Container'
  highlighted: 'Highlighted'
  page_title: 'Page Title'
  breadcrumb: 'Breadcrumb'
  sidebar_first: 'Left Sidebar'
  content: 'Content'
  sidebar_second: 'Right Sidebar'
  bottom_first: 'Bottom First Container'
  bottom_second: 'Bottom Second Container'
  bottom_third: 'Bottom Third Container'
  bottom_forth: 'Bottom Forth Container'
  footer_first: 'Footer First Container'
  footer_second: 'Footer Second Container'
  footer_third: 'Footer Third Container'
  footer_menu: 'Footer Menu Container'
  auto_hidden_block: 'Auto Hidden Blocks'
