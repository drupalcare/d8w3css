name: W3CSS Theme V2
core_version_requirement: ^11.3 || ^12
description: 'A Drupal base theme built on W3.CSS: 22 regions, horizontal or vertical menus, width presets, color themes and font choices, all set from the theme settings. <a href="https://www.w3css.flashwebcenter.com" target="_blank" rel="noopener">Demo site</a>'
package: W3CSS
type: theme
base theme: false

# Libraries
libraries:
  - drupal8_w3css_theme/w3-css
  - drupal8_w3css_theme/d8w3css-global-styling

ckeditor_stylesheets:
  - css/theme/w3-ckeditor-iframe.css

ckeditor5-stylesheets:
  - css/theme/w3-ckeditor5.css

# Regions
regions:
  header: 'Header'
  primary_menu_vertical: 'Primary Menu Vertical'
  primary_menu: 'Primary Menu'
  welcome_text: 'Welcome Text'
  top_first: 'Top First Container'
  top_second: 'Top Second Container'
  top_third: 'Top Third Container'
  highlighted: 'Highlighted'
  page_title: 'Page Title'
  breadcrumb: 'Breadcrumb'
  sidebar_first: 'Left Sidebar'
  content: 'Content'
  sidebar_second: 'Right Sidebar'
  bottom_first: 'Bottom First Container'
  bottom_second: 'Bottom Second Container'
  bottom_third: 'Bottom Third Container'
  bottom_forth: 'Bottom Forth Container'
  footer_first: 'Footer First Container'
  footer_second: 'Footer Second Container'
  footer_third: 'Footer Third Container'
  footer_menu: 'Footer Menu Container'
  auto_hidden_block: 'Auto Hidden Blocks'
