# Drupal.org GitLab CI for the W3CSS Theme (drupal8_w3css_theme).
#
# For details on customizing this file see:
# https://www.drupal.org/docs/develop/git/using-gitlab-to-contribute-to-drupal/gitlab-ci
# https://project.pages.drupalcode.org/gitlab_templates/
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  # The theme declares ^11.3 || ^12 (drupal8_w3css_theme.info.yml), so there is
  # no previous-major (Drupal 10) job. Run the jobs against the next major in
  # addition to the current core version so the D12 readiness of this branch is
  # verified on every pipeline.
  OPT_IN_TEST_NEXT_MAJOR: '1'
  # THE LINE THAT WAS MISSING, and its absence is why that job had never run.
  # `OPT_IN_TEST_*` creates the job; `_AUTORUN_*` (default 'none') decides
  # whether it runs or sits behind a manual prerequisite. With only the opt-in
  # set, this project's D12 jobs showed as `manual`/`skipped` on every pipeline
  # while the pipeline itself reported success — measured 2026-09-06 on
  # pipeline 878576. A green pipeline with no coverage is worse than a missing
  # job, because it looks fine.
  _AUTORUN_NEXT_MAJOR: 'all'
  # Current core has moved past the 11.x floor, so the previous minor gets a
  # job too.
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  # Spelling: skip vendored or generated text that is not ours to correct:
  # fonts/ (Font Awesome and Google font CSS), css/w3-css/ (vendored W3.CSS)
  # and the two generated color scheme palette folders.
  _CSPELL_IGNORE_PATHS: 'fonts/**, css/w3-css/**, css/predefined/**, css/base/w3css-drupal.css, css/base/w3css-layers.css, css/utilities/w3css-extended-classes.css, css/utilities/w3css-color-*.css, docs/class-migration.html, docs/CLASS-MIGRATION.md, src/Upgrade/w3css-rename-map.json'
  # fonts/ is in .stylelintignore, so the template's one-level glob alone would
  # see only ignored files and fail. `_STYLELINT_EXTRA` adds the css/ folder
  # (expanded recursively by Stylelint itself, minus the ignored palettes).
  _STYLELINT_EXTRA: 'css'

# Library drift: drupal8_w3css_theme.libraries.yml and src/SchemeLibraries.php are
# generated from libraries/w3css-libraries.json. This job fails when either file
# differs from what scripts/build-libraries.py writes from the data. It prints
# the library count, so a run that read nothing cannot pass.
library-drift:
  stage: validate
  image: python:3.12-bookworm
  script:
    - python3 -I scripts/build-libraries.py --check

# Scheme paint drift: the paint rules in css/predefined/ scheme files are generated
# from scripts/scheme-paint-rules.json. Fails on drift and on any
# var(..., revert-layer) under css/predefined/. Prints the file and rule counts.
scheme-paint-drift:
  stage: validate
  image: python:3.12-bookworm
  script:
    - python3 -I scripts/build-scheme-paint.py --self-test
    - python3 -I scripts/build-scheme-paint.py --check

# Rename list drift: docs/CLASS-MIGRATION.md and docs/class-migration.html are
# generated from ClassMap.php and src/Upgrade/w3css-rename-map.json. This job
# fails when either document differs from what scripts/class-list.py writes,
# and prints the row count, so a run that read nothing cannot pass.
class-list:
  stage: validate
  image: python:3.12-bookworm
  script:
    - python3 -I scripts/class-list.py --check
