# Config schema for the W3CSS Theme settings.
#
# This type describes every key the theme ships in
# config/install/drupal8_w3css_theme.settings.yml and every key the settings
# form can save. src/Upgrade/SettingsMap.php lists each key's old name; change
# the two together. tests/src/Kernel/ThemeSettingsSchemaTest.php enforces the
# match.
#
# Flags are boolean and choices are integer. Each group is one mapping because
# core saves a form group whole, so a group holds only keys the form posts.
drupal8_w3css_theme.settings:
  type: theme_settings
  label: 'W3CSS Theme settings'
  mapping:
    color_scheme:
      type: mapping
      label: 'Color scheme'
      mapping:
        predefined:
          type: string
          label: 'Predefined colour theme'
    layout:
      type: mapping
      label: 'Layout'
      mapping:
        width:
          type: string
          label: 'Website width'
        equal_columns:
          type: boolean
          label: 'Equal width columns'
        centered_login_pages:
          type: boolean
          label: 'Custom layout for the user login, register and password pages'
    effects:
      type: mapping
      label: 'Effects'
      mapping:
        reveal_on_scroll:
          type: boolean
          label: 'Full opacity on scroll'
        animated_borders:
          type: boolean
          label: 'Border animation'
        site_name_animation:
          type: string
          label: 'Site name animation'
        page_title_animation:
          type: string
          label: 'Page title animation'
    breadcrumb:
      type: mapping
      label: 'Breadcrumb'
      mapping:
        hide_page_title:
          type: boolean
          label: 'Hide the page title in the breadcrumb'
    libraries:
      type: mapping
      label: 'Libraries'
      mapping:
        font_awesome:
          type: integer
          label: 'Font Awesome library'
    typography:
      type: mapping
      label: 'Typography'
      mapping:
        load_fonts_locally:
          type: boolean
          label: 'Load Google fonts locally'
        site_font:
          type: string
          label: 'Global site font'
        heading_font:
          type: string
          label: 'Heading font'
        special_font:
          type: string
          label: 'Special font'
    region_groups:
      type: mapping
      label: 'Region groups'
      mapping:
        top:
          type: mapping
          label: 'Top'
          mapping:
            marker_class:
              type: boolean
              label: 'Top region'
        main:
          type: mapping
          label: 'Main'
          mapping:
            marker_class:
              type: boolean
              label: 'Main region'
        bottom:
          type: mapping
          label: 'Bottom'
          mapping:
            marker_class:
              type: boolean
              label: 'Bottom region'
        footer:
          type: mapping
          label: 'Footer'
          mapping:
            marker_class:
              type: boolean
              label: 'Footer region'
    social_icons:
      type: mapping
      label: 'Social icons'
      mapping:
        enabled:
          type: boolean
          label: 'Show social icons'
        size:
          type: integer
          label: 'Social media icon size'
        links:
          type: mapping
          label: 'Links'
          mapping:
            facebook:
              type: string
              label: 'Facebook URL'
            twitter:
              type: string
              label: 'X (Twitter) URL'
            pinterest:
              type: string
              label: 'Pinterest URL'
            linkedin:
              type: string
              label: 'LinkedIn URL'
            instagram:
              type: string
              label: 'Instagram URL'
            youtube:
              type: string
              label: 'YouTube URL'
            drupal:
              type: string
              label: 'Drupal.org URL'
            rss:
              type: string
              label: 'RSS URL'
            mastodon:
              type: string
              label: 'Mastodon URL'
    footer:
      type: mapping
      label: 'Footer'
      mapping:
        copyright_text:
          type: string
          label: 'Copyright text'
        show_credit_link:
          type: boolean
          label: 'Show credit link'
    region_colors:
      type: mapping
      label: 'Region colors'
      mapping:
        page_wrapper:
          type: string
          label: 'Page wrapper colour classes'
        header:
          type: string
          label: 'Header colour classes'
        primary_menu:
          type: string
          label: 'Primary menu colour classes'
        welcome_text:
          type: string
          label: 'Welcome text colour classes'
        highlighted:
          type: string
          label: 'Highlighted colour classes'
        top_container:
          type: string
          label: 'Top container colour classes'
        top_first:
          type: string
          label: 'Top first colour classes'
        top_second:
          type: string
          label: 'Top second colour classes'
        top_third:
          type: string
          label: 'Top third colour classes'
        page_title:
          type: string
          label: 'Page title colour classes'
        main:
          type: string
          label: 'Main colour classes'
        breadcrumb:
          type: string
          label: 'Breadcrumb colour classes'
        sidebar_first:
          type: string
          label: 'Left sidebar colour classes'
        content:
          type: string
          label: 'Content colour classes'
        sidebar_second:
          type: string
          label: 'Right sidebar colour classes'
        bottom_container:
          type: string
          label: 'Bottom container colour classes'
        bottom_first:
          type: string
          label: 'Bottom first colour classes'
        bottom_second:
          type: string
          label: 'Bottom second colour classes'
        bottom_third:
          type: string
          label: 'Bottom third colour classes'
        bottom_fourth:
          type: string
          label: 'Bottom fourth colour classes'
        footer_container:
          type: string
          label: 'Footer container colour classes'
        footer_first:
          type: string
          label: 'Footer first colour classes'
        footer_second:
          type: string
          label: 'Footer second colour classes'
        footer_third:
          type: string
          label: 'Footer third colour classes'
        footer_menu:
          type: string
          label: 'Footer menu colour classes'
        copyright:
          type: string
          label: 'Copyright colour classes'
