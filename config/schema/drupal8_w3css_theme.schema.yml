# Config schema for the W3CSS Theme settings.
#
# One source of truth: this type describes every key the theme ships in
# config/install/drupal8_w3css_theme.settings.yml AND every key the theme
# settings form (includes/*.inc) can save. The sub-themes (amun, amunet, anhur)
# ship their own *.settings.yml with the same keys and point their schema at
# this type. tests/src/Kernel/ThemeSettingsSchemaTest.php enforces the match.
#
# Checkboxes and radios are stored as integers (0/1, or the option key), which
# is what the install config ships and what the theme's preprocess code
# compares against. Config::save() casts submitted form strings to these types.
drupal8_w3css_theme.settings:
  type: theme_settings
  label: 'W3CSS Theme settings'
  mapping:
    current_theme:
      type: string
      label: 'Predefined colour theme'
    website_width:
      type: string
      label: 'Website width'
    equal_width:
      type: integer
      label: 'Equal width columns'
    layout_user_login_custom:
      type: integer
      label: 'Custom layout for the user login, register and password pages'
    full_opacity_onscroll:
      type: integer
      label: 'Full opacity on scroll'
    breadcrumb_page_title:
      type: integer
      label: 'Hide the page title in the breadcrumb'
    border_animation:
      type: integer
      label: 'Border animation'
    sitename_animation:
      type: string
      label: 'Site name animation'
    pagetitle_animation:
      type: string
      label: 'Page title animation'
    d8w3css_font_awesome:
      type: integer
      label: 'Font Awesome library'
    d8w3css_google_font_local:
      type: integer
      label: 'Load Google fonts locally'
    d8w3css_site_gf:
      type: string
      label: 'Global site font'
    d8w3css_site_gfh:
      type: string
      label: 'Heading font'
    d8w3css_site_gfs:
      type: string
      label: 'Special font'
    top_region:
      type: integer
      label: 'Top region'
    main_region:
      type: integer
      label: 'Main region'
    bottom_region:
      type: integer
      label: 'Bottom region'
    footer_region:
      type: integer
      label: 'Footer region'
    show_social_icon:
      type: integer
      label: 'Show social icons'
    social_media_size:
      type: integer
      label: 'Social media icon size'
    facebook_url:
      type: string
      label: 'Facebook URL'
    twitter_url:
      type: string
      label: 'X (Twitter) URL'
    pinterest_url:
      type: string
      label: 'Pinterest URL'
    linkedin_url:
      type: string
      label: 'LinkedIn URL'
    instagram_url:
      type: string
      label: 'Instagram URL'
    youtube_url:
      type: string
      label: 'YouTube URL'
    drupal_url:
      type: string
      label: 'Drupal.org URL'
    rss_url:
